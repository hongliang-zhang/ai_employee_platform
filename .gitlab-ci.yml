stages:
  - validate

variables:
  PNPM_VERSION: "9.0.0"

.pnpm_setup:
  image: uhub.service.ucloud.cn/wudao/ci-node:22p1
  tags:
    - dev-v1
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# Doc checks: cross-link validity + index consistency
# Runs in parallel with lint and test
doc-check:
  extends: .pnpm_setup
  stage: validate
  script:
    - pnpm tsx scripts/check-doc-links.ts
    - pnpm tsx scripts/check-doc-index.ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Lint runs in parallel with tests — both must pass
lint:
  extends: .pnpm_setup
  stage: validate
  script:
    - pnpm lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test:
  extends: .pnpm_setup
  stage: validate
  services:
    - name: uhub.service.ucloud.cn/wudao/ci-postgres:16p1
      alias: postgres
  variables:
    POSTGRES_DB: aaas
    POSTGRES_USER: aaas
    POSTGRES_PASSWORD: aaas
    DATABASE_URL: postgres://aaas:aaas@postgres:5432/aaas
    JWT_SECRET: test-secret-32-chars-minimum-len
    LLM_API_KEY: test-key
  script:
    - pnpm --filter @aaas/db exec prisma generate
    - pnpm --filter @aaas/db exec prisma migrate deploy
    - pnpm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Doc Gardening: weekly automated doc audit via Claude Code in e2b sandbox
# Triggered by scheduled pipeline with DOC_GARDENING=true variable
doc-gardening:
  extends: .pnpm_setup
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DOC_GARDENING == "true"
  script:
    - pnpm tsx scripts/doc-gardening/run.ts
  timeout: 35m
